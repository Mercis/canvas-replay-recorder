<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Canvas Frame Recorder Demo</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;color:#e5e7eb;font-family:Arial,sans-serif}
    main{width:min(920px,94vw)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    canvas{width:100%;background:#020617;border:1px solid #475569;border-radius:8px}
    .bar{display:flex;gap:8px;margin:12px 0;align-items:center}
    button{height:34px;padding:0 14px;border:1px solid #64748b;border-radius:6px;background:#1f2937;color:#f8fafc;cursor:pointer}
    small{color:#94a3b8}
    @media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <h1>Canvas Frame Recorder</h1>
    <div class="bar">
      <button id="start">Start</button>
      <button id="stop">Stop and Play</button>
      <small id="status">idle</small>
    </div>
    <div class="grid">
      <section><h2>Live canvas</h2><canvas id="live" width="420" height="320"></canvas></section>
      <section><h2>Replay canvas</h2><canvas id="replay" width="420" height="320"></canvas></section>
    </div>
  </main>
  <script src="canvas-frame-recorder.js"></script>
  <script>
    const live = document.getElementById('live');
    const ctx = live.getContext('2d');
    const status = document.getElementById('status');
    let recorder = new CanvasFrameReplay.CanvasFrameRecorder(live, { fps: 12, mimeType: 'image/webp', quality: 0.75 });
    let player = null;
    let start = performance.now();

    function draw(now) {
      const t = (now - start) / 1000;
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, live.width, live.height);
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(210 + Math.cos(t * 2) * 120, 160 + Math.sin(t * 3) * 90, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(40 + (t * 80) % 320, 245, 54, 38);
      ctx.fillStyle = '#e5e7eb';
      ctx.font = '700 22px Arial';
      ctx.fillText('t=' + t.toFixed(1), 18, 34);
      requestAnimationFrame(draw);
    }

    document.getElementById('start').onclick = () => {
      recorder.start();
      status.textContent = 'recording';
    };

    document.getElementById('stop').onclick = () => {
      const recording = recorder.stop();
      if (player) player.destroy();
      player = new CanvasFrameReplay.CanvasFramePlayer(document.getElementById('replay'), recording, { autoPlay: true, loop: true });
      status.textContent = `${recording.frames.length} frames, ${(recording.duration / 1000).toFixed(1)}s`;
    };

    requestAnimationFrame(draw);
  </script>
</body>
</html>
